{{ define "main" }}
  <section class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}{{ . }}{{ end }}
  </section>

  <section class="post-list">
    {{ partial "post-list.html" .Paginator.Pages }}
    {{ template "_internal/pagination.html" . }}
    <p class="subscribe">subscribe <a href="{{ "/index.xml" | relURL }}">via RSS</a></p>
  </section>
{{ end }}
