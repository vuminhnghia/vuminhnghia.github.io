<header class="site-header">
  <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav class="nav">
    {{ range site.Menus.main }}
      {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
      <a href="{{ .URL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
